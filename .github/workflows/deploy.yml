name: Build and deploy

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/monashautomation/skill-tracker:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump overlay image tag
        env:
          IMAGE_SHA: sha-${{ github.sha }}
        run: |
          cd deploy/overlays/prod
          npx --yes kustomize edit set image \
            "ghcr.io/monashautomation/skill-tracker=ghcr.io/monashautomation/skill-tracker:${IMAGE_SHA}"

      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/prod/kustomization.yaml
          git diff --cached --quiet || git commit -m "chore: deploy sha-${{ github.sha }}"
          git push
