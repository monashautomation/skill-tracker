apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skill-tracker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/monashautomation/skill-tracker.git
    targetRevision: main
    path: deploy/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: skills
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
