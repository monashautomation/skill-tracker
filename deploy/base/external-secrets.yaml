apiVersion: v1
kind: ServiceAccount
metadata:
  name: skills-eso
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: skills-vault
spec:
  provider:
    vault:
      server: "http://openbao.openbao.svc.cluster.local:8200"
      path: "skills"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "skills"
          serviceAccountRef:
            name: skills-eso
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: skills-web-secrets
spec:
  secretStoreRef:
    name: skills-vault
    kind: SecretStore
  target:
    name: skills-web-secrets
  refreshInterval: 1h
  data:
    - secretKey: DJANGO_SECRET_KEY
      remoteRef:
        key: web
        property: DJANGO_SECRET_KEY
    - secretKey: DATABASE_URL
      remoteRef:
        key: web
        property: DATABASE_URL
    - secretKey: SKILL_TRACKER_TOKEN
      remoteRef:
        key: web
        property: SKILL_TRACKER_TOKEN
    - secretKey: DIRECTORY_API_KEY
      remoteRef:
        key: web
        property: DIRECTORY_API_KEY
    - secretKey: AUTHENTIK_CLIENT_ID
      remoteRef:
        key: web
        property: AUTHENTIK_CLIENT_ID
    - secretKey: AUTHENTIK_CLIENT_SECRET
      remoteRef:
        key: web
        property: AUTHENTIK_CLIENT_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: skills-postgres-secrets
spec:
  secretStoreRef:
    name: skills-vault
    kind: SecretStore
  target:
    name: skills-postgres-secrets
  refreshInterval: 1h
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: postgres
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: postgres
        property: POSTGRES_PASSWORD
