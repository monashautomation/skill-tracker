apiVersion: batch/v1
kind: CronJob
metadata:
  name: skills-sync-directory
  annotations:
    # A stale/failed last run must never gate sync-wave progression for the
    # actual app deploy (migrate/web waves).
    argocd.argoproj.io/sync-options: SkipHealthCheck
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
            - name: ghcr-pull-secret
          containers:
            - name: sync-directory
              image: ghcr.io/monashautomation/skill-tracker:latest
              command: ["python", "manage.py", "sync_directory"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              envFrom:
                - configMapRef:
                    name: skills-web-config
                - secretRef:
                    name: skills-web-secrets
